name = "insert-player-api-sandbox"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[vars]
ENVIRONMENT = "sandbox"
# Sandbox data, auth, and billing must never use production origins or resources.
CORS_ORIGIN = "https://insert-player-sandbox.pages.dev,http://localhost:5173,http://127.0.0.1:5174"
PUBLIC_APP_NAME = "Insert Player"
PUBLIC_APP_SHORT_NAME = "P1"
PUBLIC_SOCIAL_CARD_PATH = "/assets/social-card.png"
TURNSTILE_REQUIRED = "false"
TURNSTILE_ACTION = "anonymous_rookie"
TURNSTILE_HOSTNAMES = "insert-player-sandbox.pages.dev,localhost,127.0.0.1"
ANONYMOUS_ROOKIE_ENABLED = "false"
GENERATION_API_BASE_URL = "https://insert-player-api-sandbox.shellbot.workers.dev"
# Sandbox stays on its own direct Google credential until a separate sandbox
# Meterkey wallet/key is provisioned. Production is pinned independently.
GEMINI_TRANSPORT = "google-direct"
METERKEY_BASE_URL = "https://meter.hilo.cx"
CLERK_ISSUER = "https://right-cricket-1317.clerk.accounts.dev"
CLERK_AUTHORIZED_PARTIES = "https://insert-player-sandbox.pages.dev,http://localhost:5173,http://127.0.0.1:5174"
# Add only Insert Player sandbox Stripe ids here. Secrets remain Worker secrets:
STRIPE_ACCOUNT_ID = "acct_1U5w8DCQ9OPSWOkj"
STRIPE_PRICE_STARTER = "price_1U6H1vCQ9OPSWOkj1ljokcL6"
STRIPE_PRICE_VERSUS = "price_1U6H1wCQ9OPSWOkjuTEqzam3"
STRIPE_PRICE_ARCADE = "price_1U6H1xCQ9OPSWOkjLU7ClORv"

[secrets]
required = [
  "GEMINI_API_KEY",
  "FAL_API_KEY",
  "RUNWAY_API_KEY",
  "FREEPIK_API_KEY",
  "LUDO_API_KEY",
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
  "CLERK_WEBHOOK_SIGNING_SECRET",
  "TURNSTILE_SECRET_KEY",
  "ANONYMIZATION_SECRET",
  "GENERATION_JOB_SIGNING_SECRET",
  "CLERK_BACKEND_AUTH_BRIDGE_SECRET",
]

[limits]
cpu_ms = 300000

[[workflows]]
binding = "FIGHTER_GENERATION"
name = "insert-player-fighter-generation-sandbox"
class_name = "FighterGenerationWorkflow"

[[containers]]
name = "insert-player-image-processor-sandbox"
class_name = "ImageProcessorContainer"
image = "../Dockerfile.processor"
image_build_context = ".."
max_instances = 3
instance_type = "basic"

[containers.constraints]
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "IMAGE_PROCESSOR"
class_name = "ImageProcessorContainer"

[[migrations]]
tag = "image-processor-v1"
new_sqlite_classes = ["ImageProcessorContainer"]

[[d1_databases]]
binding = "DB"
database_name = "insert-player-sandbox-db"
database_id = "f60b6e22-d262-4e46-a7d9-ca095e49d102"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SPRITES"
bucket_name = "insert-player-sandbox-assets"
jurisdiction = "eu"

[dev]
port = 8788

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["17 4 * * *"]
