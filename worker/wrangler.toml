name = "ai-street-fighter-api"
main = "src/index.ts"
compatibility_date = "2026-08-22"
compatibility_flags = ["nodejs_compat"]

[version_metadata]
binding = "WORKER_VERSION_METADATA"

[vars]
ENVIRONMENT = "production"
# Comma-separated frontend origins allowed to call the Worker.
CORS_ORIGIN = "https://insertplayer.ai,https://www.insertplayer.ai"
PUBLIC_APP_NAME = "Insert Player"
PUBLIC_APP_SHORT_NAME = "P1"
PUBLIC_SOCIAL_CARD_PATH = "/assets/social-card.png"
TURNSTILE_REQUIRED = "true"
TURNSTILE_ACTION = "anonymous_rookie"
TURNSTILE_HOSTNAMES = "insertplayer.ai,www.insertplayer.ai"
ANONYMOUS_ROOKIE_ENABLED = "true"
# Durable generation requests remain credit-backed, session-bounded, rate
# limited, and recorded in the provider cost ledger.
GENERATION_API_BASE_URL = "https://api.insertplayer.ai"
# Keep the Gemini API contract while routing production requests through the
# dedicated Insert Player Meterkey wallet and Google AI Studio BYOK.
GEMINI_TRANSPORT = "meterkey"
METERKEY_BASE_URL = "https://meter.hilo.cx"
PIXCLI_BASE_URL = "https://pixcli.hilo.cx"
# Set this to your Clerk issuer, for example:
# Production Clerk uses the dedicated Insert Player Frontend API domain.
CLERK_ISSUER = "https://clerk.insertplayer.ai"
# Keep token azp validation explicit and aligned with CORS.
CLERK_AUTHORIZED_PARTIES = "https://insertplayer.ai,https://www.insertplayer.ai"
# API keys are Worker secrets, not Vite-exposed env vars:
# wrangler secret put METERKEY_API_KEY
# GEMINI_API_KEY remains installed only for an explicit rollback version; the
# meterkey transport never reads it or falls back to it.
# wrangler secret put GEMINI_API_KEY
# wrangler secret put FAL_API_KEY
# wrangler secret put RUNWAY_API_KEY
# wrangler secret put FREEPIK_API_KEY
# wrangler secret put LUDO_API_KEY
# wrangler secret put PIXCLI_API_KEY
# wrangler secret put STRIPE_SECRET_KEY
# wrangler secret put STRIPE_WEBHOOK_SECRET
# Pin Checkout and webhooks to the dedicated Insert Player Stripe account.
STRIPE_ACCOUNT_ID = "acct_1U5w7XCPjQq08iG9"
STRIPE_PRICE_STARTER = "price_1U7DsICPjQq08iG9cfEyX3NU"
STRIPE_PRICE_VERSUS = "price_1U7DsJCPjQq08iG9feLhQhLr"
STRIPE_PRICE_ARCADE = "price_1U7DsKCPjQq08iG98e4ZosBp"
# wrangler secret put CLERK_WEBHOOK_SIGNING_SECRET
# wrangler secret put TURNSTILE_SECRET_KEY
# HMAC key used to pseudonymize anonymous network identifiers before D1 writes.
# wrangler secret put ANONYMIZATION_SECRET
# HMAC key for short-lived, job-scoped backend generation tokens.
# wrangler secret put GENERATION_JOB_SIGNING_SECRET
# Private bridge for Clerk Agent Task launch smoke; never expose it through CORS.
# wrangler secret put CLERK_BACKEND_AUTH_BRIDGE_SECRET
# Optional Cloudflare Realtime TURN credentials for online versus. Without them
# /api/versus/ice-servers returns STUN only and rooms fall back to relay.
# wrangler secret put REALTIME_TURN_KEY_ID
# wrangler secret put REALTIME_TURN_API_TOKEN

[secrets]
required = [
  "METERKEY_API_KEY",
  "GEMINI_API_KEY",
  "FAL_API_KEY",
  "RUNWAY_API_KEY",
  "FREEPIK_API_KEY",
  "LUDO_API_KEY",
  "PIXCLI_API_KEY",
  "STRIPE_SECRET_KEY",
  "STRIPE_WEBHOOK_SECRET",
  "CLERK_WEBHOOK_SIGNING_SECRET",
  "TURNSTILE_SECRET_KEY",
  "ANONYMIZATION_SECRET",
  "GENERATION_JOB_SIGNING_SECRET",
  "CLERK_BACKEND_AUTH_BRIDGE_SECRET",
]

[limits]
cpu_ms = 300000

[[workflows]]
binding = "FIGHTER_GENERATION"
name = "insert-player-fighter-generation"
class_name = "FighterGenerationWorkflow"

[[containers]]
name = "insert-player-image-processor"
class_name = "ImageProcessorContainer"
image = "../Dockerfile.processor"
image_build_context = ".."
# Reviewed video batches retain named processors across a rollout; leave headroom
# for the next review-gated action while older instances finish going idle.
max_instances = 32
instance_type = "basic"

[containers.constraints]
jurisdiction = "eu"

[[durable_objects.bindings]]
name = "IMAGE_PROCESSOR"
class_name = "ImageProcessorContainer"

[[migrations]]
tag = "image-processor-v1"
new_sqlite_classes = ["ImageProcessorContainer"]

# Online versus rooms: one hibernating Durable Object per room code relays
# WebRTC signalling (and input frames as a fallback) between two seated players.
[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "match-room-v1"
new_sqlite_classes = ["MatchRoom"]

[[d1_databases]]
binding = "DB"
database_name = "insert-player-db"
database_id = "aa9e6ba6-8a7f-4261-ac31-986e6cf44659"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "SPRITES"
bucket_name = "insert-player-assets"
jurisdiction = "eu"
# The Worker stores provider temp inputs under the temp/ prefix and refuses them
# after 24h. Add a matching R2 lifecycle delete rule in Cloudflare for temp/*.

[dev]
port = 8787

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["0 4 * * *"]
