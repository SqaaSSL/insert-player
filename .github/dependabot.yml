version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      worker-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /processor
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      processor-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:45'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
