name: Reusable validation

on:
  workflow_call:

permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  validate:
    name: Production gate
    runs-on: ubuntu-24.04
    # Dependency restores occasionally spend several minutes per workspace on
    # GitHub-hosted runners. Keep the gate fail-closed, but leave enough room
    # for the real Docker/FFmpeg and production checks after a slow npm mirror.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            processor/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Worker dependencies
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Install processor dependencies
        run: npm --prefix processor ci --no-audit --no-fund

      - name: Test video compiler with production FFmpeg toolchain
        run: docker build --file Dockerfile.processor --target video-sprite-test .

      - name: Run production checks
        env:
          VIDEO_SPRITE_PRODUCTION_TOOLCHAIN_VALIDATED: "1"
        run: npm run check:production

      - name: Test immutable QA pose atlas
        run: npm --prefix processor run qa:pose-atlas:test

      - name: Build production frontend
        run: npm run build

      - name: Build sandbox frontend
        run: npm run build:sandbox

      - name: Validate production Worker bundle
        run: npm --prefix worker run deploy -- --dry-run

      - name: Validate sandbox Worker bundle
        run: npm --prefix worker run deploy:sandbox -- --dry-run

      - name: Reject unresolved high or critical dependency alerts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          blocking="$(
            gh api --method GET "repos/${GITHUB_REPOSITORY}/dependabot/alerts" \
              -f state=open \
              -f per_page=100 \
              --paginate \
              --jq '.[]
                | (.security_advisory.severity // .security_vulnerability.severity // "") as $severity
                | select($severity == "high" or $severity == "critical")
                | "#\(.number) [\($severity)] \(.dependency.manifest_path): \(.dependency.package.name) \(.html_url)"'
          )"
          if [[ -n "$blocking" ]]; then
            printf 'Open high or critical Dependabot alerts block this release:\n%s\n' "$blocking" >&2
            exit 1
          fi
          printf 'No open high or critical Dependabot alerts.\n'
