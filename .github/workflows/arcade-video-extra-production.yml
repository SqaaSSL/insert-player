name: Start, activate or roll back one reviewed Arcade extra move

# One review-gated extra special move (fireball | uppercut) for an active
# reviewed official Champion. "start" generates one clip and stops at review
# (inspect/decide with arcade-video-review-production.yml); "activate"
# publishes only that approved move; "rollback" unpublishes exactly it.

on:
  workflow_dispatch:
    inputs:
      operation:
        description: start one clip, activate an approved one, or roll it back
        required: true
        default: start
        type: choice
        options:
          - start
          - activate
          - rollback
      slug:
        description: One active official fighter slug from arcade/roster-2026.json
        required: true
        type: string
      animation:
        description: Extra move (start only)
        required: true
        default: fireball
        type: choice
        options:
          - fireball
          - uppercut
      confirmation:
        description: Exact confirmation phrase for the selected operation
        required: true
        type: string
      reviewed_manifest_run_id:
        description: Start only. Completed approved canonical producer run (e.g. the live canonical seal)
        required: false
        type: string
      job_id:
        description: Activate/rollback only. Exact approved extra-move Video job id
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false
  queue: max

jobs:
  video-extra:
    name: ${{ inputs.operation }} one reviewed extra move
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      REQUESTED_SLUG: ${{ inputs.slug }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_ANIMATION: ${{ inputs.animation }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      REVIEWED_MANIFEST_RUN_ID: ${{ inputs.reviewed_manifest_run_id }}
      EXTRA_JOB_ID: ${{ inputs.job_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ASF_ARCADE_CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
      ASF_ARCADE_ADMIN_CLERK_USER_ID: ${{ secrets.ASF_ARCADE_ADMIN_CLERK_USER_ID }}
      ASF_WORKER_URL: ${{ vars.ASF_WORKER_URL }}
      ASF_WORKER_HEALTH_URL: ${{ vars.ASF_WORKER_HEALTH_URL }}
      CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate the separately guarded request
        shell: bash
        run: |
          [[ "$REQUESTED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || {
            printf '::error::Invalid Arcade fighter slug.\n'; exit 1; }
          [[ "$REQUESTED_ANIMATION" == "fireball" || "$REQUESTED_ANIMATION" == "uppercut" ]] || {
            printf '::error::Unsupported extra move.\n'; exit 1; }
          case "$REQUESTED_OPERATION" in
            start)
              expected_confirmation="START_REVIEW_GATED_VIDEO_EXTRA_ANIMATION"
              [[ "$REVIEWED_MANIFEST_RUN_ID" =~ ^[1-9][0-9]*$ && -z "$EXTRA_JOB_ID" ]] || {
                printf '::error::start requires reviewed_manifest_run_id and no job_id.\n'; exit 1; }
              ;;
            activate)
              expected_confirmation="ACTIVATE_REVIEWED_ARCADE_EXTRA_ANIMATION"
              [[ "$EXTRA_JOB_ID" =~ ^[a-f0-9]{32}$ ]] || {
                printf '::error::activate requires the exact approved job_id.\n'; exit 1; }
              ;;
            rollback)
              expected_confirmation="ROLLBACK_REVIEWED_ARCADE_EXTRA_ANIMATION"
              [[ "$EXTRA_JOB_ID" =~ ^[a-f0-9]{32}$ ]] || {
                printf '::error::rollback requires the exact approved job_id.\n'; exit 1; }
              ;;
            *) printf '::error::Unsupported extra-move operation.\n'; exit 1 ;;
          esac
          [[ "$REQUESTED_CONFIRMATION" == "$expected_confirmation" ]] || {
            printf '::error::The operation requires its exact dedicated confirmation phrase.\n'; exit 1; }
          [[ -n "$ASF_ARCADE_CLERK_SECRET_KEY" && -n "$ASF_ARCADE_ADMIN_CLERK_USER_ID" ]] || {
            printf '::error::Production Arcade Clerk admin secrets are unavailable.\n'; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Pin the live Worker to this reviewed commit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const configured = process.env.ASF_WORKER_HEALTH_URL?.trim() ?? '';
          const workerBase = process.env.ASF_WORKER_URL?.trim() ?? '';
          if (workerBase !== 'https://api.insertplayer.ai') {
            throw new Error('Reviewed production operations require exact ASF_WORKER_URL=https://api.insertplayer.ai.');
          }
          const expectedSha = process.env.GITHUB_SHA?.trim() ?? '';
          const expectedTarget = `${workerBase}/health`;
          const target = configured || expectedTarget;
          if (!/^[a-f0-9]{40}$/.test(expectedSha) || new URL(target).toString() !== expectedTarget) {
            throw new Error('Worker health URL and full reviewed commit SHA are required.');
          }
          const response = await fetch(target, { redirect: 'error', signal: AbortSignal.timeout(30_000) });
          if (!response.ok) throw new Error(`Worker health failed with HTTP ${response.status}.`);
          const health = await response.json();
          const expectedTag = new RegExp(`^prod-${expectedSha}-[1-9][0-9]*$`);
          if (
            health?.status !== 'ok' || health.environment !== 'production' ||
            health.storage?.d1 !== 'bound' || health.storage?.r2 !== 'bound' ||
            typeof health.workerVersion?.id !== 'string' || !health.workerVersion.id ||
            typeof health.workerVersion?.tag !== 'string' || !expectedTag.test(health.workerVersion.tag)
          ) throw new Error(`Live Worker is not the healthy production deployment for ${expectedSha}.`);
          console.log(`Worker health pinned to ${health.workerVersion.tag}.`);
          NODE

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Restore and verify the private licensed source
        run: npm run arcade:sources -- --target=production --slug="$REQUESTED_SLUG"

      - name: Download the separately reviewed canonical manifest
        if: inputs.operation == 'start'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_metadata="$RUNNER_TEMP/reviewed-canonical-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REVIEWED_MANIFEST_RUN_ID" > "$run_metadata"
          REVIEWED_RUN_METADATA="$run_metadata" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync(process.env.REVIEWED_RUN_METADATA, 'utf8'));
          const allowedProducerPaths = new Set([
            '.github/workflows/import-reviewed-xai-canonical-production.yml',
            '.github/workflows/import-reviewed-elon-mixed-canonical-production.yml',
            '.github/workflows/import-reviewed-global-mixed-canonical-production.yml',
            '.github/workflows/import-reviewed-manual-canonical-production.yml',
            '.github/workflows/seal-live-canonical-sources-production.yml',
          ]);
          const producerPath = String(run.path ?? '').split('@', 1)[0];
          if (
            run.id !== Number(process.env.REVIEWED_MANIFEST_RUN_ID) || run.status !== 'completed' ||
            run.conclusion !== 'success' || run.event !== 'workflow_dispatch' ||
            run.head_repository?.full_name !== process.env.GITHUB_REPOSITORY ||
            !allowedProducerPaths.has(producerPath)
          ) {
            throw new Error(
              'reviewed_manifest_run_id is not a successful completed run of an approved canonical-import workflow in this repository.',
            );
          }
          console.log(`Reviewed manifest producer pinned to ${producerPath} run ${run.id}.`);
          NODE
          destination="$RUNNER_TEMP/reviewed-canonical"
          mkdir -p "$destination"
          gh run download "$REVIEWED_MANIFEST_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "arcade-reviewed-canonical-manifest-$REQUESTED_SLUG" \
            --dir "$destination"
          manifest="$destination/reviewed-canonical-manifest.json"
          [[ -f "$manifest" ]] || {
            printf '::error::The reviewed artifact did not contain reviewed-canonical-manifest.json.\n'; exit 1; }
          printf 'REVIEWED_CANONICAL_MANIFEST_ARG=--reviewed-canonical-manifest=%s\n' "$manifest" >> "$GITHUB_ENV"

      - name: Start, activate or roll back exactly one extra move
        shell: bash
        run: |
          args=(
            --target=production
            --slug="$REQUESTED_SLUG"
            --confirm-production
            --expected-deployed-sha="$GITHUB_SHA"
          )
          case "$REQUESTED_OPERATION" in
            start)
              [[ -n "${REVIEWED_CANONICAL_MANIFEST_ARG:-}" ]] || {
                printf '::error::The required reviewed canonical manifest was not bound.\n'; exit 1; }
              args+=(
                --video-extra-animation="$REQUESTED_ANIMATION"
                --confirm-video-extra="$REQUESTED_CONFIRMATION"
                "$REVIEWED_CANONICAL_MANIFEST_ARG"
                --reviewed-manifest-run-id="$REVIEWED_MANIFEST_RUN_ID"
                --video-review-export-dir="$RUNNER_TEMP/video-review"
              )
              ;;
            activate)
              args+=(--activate-reviewed-extra --reviewed-video-extra-job-id="$EXTRA_JOB_ID" --confirm-activation="$REQUESTED_CONFIRMATION")
              ;;
            rollback)
              args+=(--rollback-reviewed-extra --reviewed-video-extra-job-id="$EXTRA_JOB_ID" --confirm-activation="$REQUESTED_CONFIRMATION")
              ;;
          esac
          npm run arcade:seed -- "${args[@]}"

      - name: Upload the private bound Video review media
        if: always() && inputs.operation == 'start'
        uses: actions/upload-artifact@v7
        with:
          name: arcade-video-review-${{ inputs.slug }}-${{ github.run_id }}
          path: ${{ runner.temp }}/video-review
          if-no-files-found: warn
          retention-days: 14
