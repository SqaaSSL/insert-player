name: Generate production signature stage

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Sealed stage publication request
        required: true
        default: insert-player-arena
        type: choice
        options:
          - insert-player-arena
      confirmation:
        description: Enter GENERATE_ONE_STAGE_PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false

jobs:
  generate:
    name: One-call stage generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ASF_ARCADE_CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
      ASF_ARCADE_ADMIN_CLERK_USER_ID: ${{ secrets.ASF_ARCADE_ADMIN_CLERK_USER_ID }}
      CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}

    steps:
      - name: Validate guarded request
        shell: bash
        env:
          REQUESTED_STAGE: ${{ inputs.stage }}
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$REQUESTED_STAGE" == "insert-player-arena" ]] || {
            printf '::error::Unknown sealed stage request.\n'
            exit 1
          }
          [[ "$REQUESTED_CONFIRMATION" == "GENERATE_ONE_STAGE_PRODUCTION" ]] || {
            printf '::error::Exact production confirmation is required.\n'
            exit 1
          }
          [[ -n "$ASF_ARCADE_CLERK_SECRET_KEY" && -n "$ASF_ARCADE_ADMIN_CLERK_USER_ID" \
            && ${#CLERK_BACKEND_AUTH_BRIDGE_SECRET} -ge 32 ]] || {
            printf '::error::Production Clerk automation credentials are unavailable.\n'
            exit 1
          }

      - name: Check out reviewed source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install deterministic image runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          npx playwright install --with-deps chromium
          ffmpeg -version

      - name: Generate one stage with no retry or fallback
        run: >-
          node scripts/generate-signature-stage.mjs
          --request=arcade/stage-publication-requests/insert-player-arena.json
          --output-dir=stage-publication-output

      - name: Publish immutable review artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: insert-player-arena-pipeline-v1-${{ github.run_id }}
          path: stage-publication-output/
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize sealed output
        if: success()
        shell: bash
        run: |
          jq -r '
            "### Stage generation complete\n" +
            "- Stage: `" + .stageId + "`\n" +
            "- Model: `" + .model + "` via `" + .transport + "`\n" +
            "- Maximum provider calls: `" + (.limits.providerCalls | tostring) + "`\n" +
            "- Estimated cost ceiling: `" + (.limits.estimatedCostCents | tostring) + " cents`\n" +
            "- Active SHA-256: `" + .activeOutput.sha256 + "`\n" +
            "- Review is mandatory before the asset is committed or published."
          ' stage-publication-output/insert-player-arena-pipeline-v1.provenance.json >> "$GITHUB_STEP_SUMMARY"
