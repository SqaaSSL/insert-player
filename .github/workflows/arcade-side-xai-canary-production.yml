name: Run production XAI SIDE pose-transfer canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter ARCADE_SIDE_XAI_TRUMP_POSE_TRANSFER_V2 to authorize exactly one paid two-reference SIDE call
        required: true
        type: string
      resume_run_id:
        description: Optional prior canary run ID whose immutable checkpoint should be resumed
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false

jobs:
  canary:
    name: Donald Trump identity plus pinned pose master
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
      PIXCLI_BASE_URL: https://pixcli.hilo.cx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate the sealed one-call request
        shell: bash
        run: |
          [[ "$REQUESTED_CONFIRMATION" == "ARCADE_SIDE_XAI_TRUMP_POSE_TRANSFER_V2" ]] || {
            printf '::error::The exact XAI SIDE canary confirmation phrase is required.\n'
            exit 1
          }
          [[ -n "$PIXCLI_API_KEY" ]] || {
            printf '::error::PIXCLI_API_KEY is unavailable in the production environment.\n'
            exit 1
          }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            printf '::error::CLOUDFLARE_API_TOKEN is unavailable in the production environment.\n'
            exit 1
          }
          if [[ -n "$RESUME_RUN_ID" && ! "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            printf '::error::resume_run_id must be a numeric GitHub Actions run ID.\n'
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Prove provider prompt isolation and one-call runner
        run: npm run test:arcade:xai-canary

      - name: Restore a prior paid checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$RESUME_RUN_ID"
          --repo "${{ github.repository }}"
          --name arcade-side-xai-trump-pose-transfer-v2-state
          --dir .

      - name: Restore and verify the private licensed Trump source
        run: npm run arcade:sources -- --target=production --slug=donald-trump

      - name: Restore and verify the immutable pose master
        run: npm run arcade:pose-master -- --target=production --master=xai-milei-side-v1

      - name: Execute exactly one pinned two-reference XAI SIDE request
        run: >-
          npm run arcade:canary:xai-side --
          --execute
          --confirm=ARCADE_SIDE_XAI_TRUMP_POSE_TRANSFER_V2
          --state=.arcade-side-xai-pose-transfer-canary-state.json
          --pose-master-upload-state=.arcade-xai-pose-master-upload-state.json
          --output-dir=.artifacts/arcade-side-xai-pose-transfer-canary

      - name: Publish experiment summary
        if: always()
        shell: bash
        run: |
          summary=.artifacts/arcade-side-xai-pose-transfer-canary/arcade-side-xai-trump-pose-transfer-v2/summary.md
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable audit bundle and resumable state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arcade-side-xai-trump-pose-transfer-v2-state
          path: |
            .arcade-side-xai-pose-transfer-canary-state.json
            .arcade-xai-pose-master-upload-state.json
            .artifacts/arcade-side-xai-pose-transfer-canary/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
