name: Production launch smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-launch-smoke
  cancel-in-progress: false

jobs:
  launch-smoke:
    name: Clerk, storage, clone, and deletion smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      ASF_LAUNCH_SMOKE_CLERK_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
      CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
      ASF_WORKER_URL: ${{ vars.ASF_WORKER_URL }}
      ASF_FRONTEND_URL: ${{ vars.ASF_FRONTEND_URL }}
      ASF_FRONTEND_ORIGIN: ${{ vars.ASF_FRONTEND_ORIGIN }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install launch-smoke dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run authenticated production launch smoke
        run: npm run smoke:live:automated

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: production-launch-smoke-browser-diagnostics
          path: ${{ runner.temp }}/insert-player-launch-smoke
          if-no-files-found: ignore
          retention-days: 7
