name: Run production Milei XAI HIGH_PUNCH QA canary

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter ARCADE_QA_MILEI_HIGH_PUNCH_F4_XAI_V1 to authorize exactly one paid three-reference frame (estimated USD 0.07)
        required: true
        type: string
      resume_run_id:
        description: Optional prior QA canary run ID whose immutable checkpoint should be resumed
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false

jobs:
  canary:
    name: Milei canonical in pinned HIGH_PUNCH frame 4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
      PIXCLI_BASE_URL: https://pixcli.hilo.cx

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate the sealed one-call request
        shell: bash
        run: |
          [[ "$REQUESTED_CONFIRMATION" == "ARCADE_QA_MILEI_HIGH_PUNCH_F4_XAI_V1" ]] || {
            printf '::error::The exact Milei HIGH_PUNCH QA confirmation phrase is required.\n'
            exit 1
          }
          [[ -n "$PIXCLI_API_KEY" ]] || {
            printf '::error::PIXCLI_API_KEY is unavailable in the production environment.\n'
            exit 1
          }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            printf '::error::CLOUDFLARE_API_TOKEN is unavailable in the production environment.\n'
            exit 1
          }
          if [[ -n "$RESUME_RUN_ID" && ! "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
            printf '::error::resume_run_id must be a numeric GitHub Actions run ID.\n'
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Prove atlas, prompt, price pin, and one-call resume behavior
        run: npm run test:arcade:xai-qa-motion

      - name: Restore a prior paid QA checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "$RESUME_RUN_ID"
          --repo "${{ github.repository }}"
          --name arcade-qa-milei-high-punch-f4-xai-v1-state
          --dir .

      - name: Restore and verify the private licensed Milei identity source
        run: npm run arcade:sources -- --target=production --slug=javier-milei

      - name: Restore and verify the immutable pose and canonical references
        run: >-
          npm run arcade:qa-motion-references --
          --candidate=arcade-qa-milei-high-punch-f4-xai-v1

      - name: Execute exactly one pinned three-reference XAI frame
        run: >-
          npm run arcade:canary:xai-qa-motion --
          --execute
          --confirm=ARCADE_QA_MILEI_HIGH_PUNCH_F4_XAI_V1
          --state=.arcade-qa-milei-high-punch-f4-xai-state.json
          --pose-upload-state=.arcade-qa-high-punch-f4-upload-state.json
          --canonical-upload-state=.arcade-qa-milei-canonical-upload-state.json
          --output-dir=.artifacts/arcade-motion-xai-canary

      - name: Publish experiment summary
        if: always()
        shell: bash
        run: |
          summary=.artifacts/arcade-motion-xai-canary/arcade-qa-milei-high-punch-f4-xai-v1/summary.md
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload immutable audit bundle and resumable state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arcade-qa-milei-high-punch-f4-xai-v1-state
          path: |
            .arcade-qa-milei-high-punch-f4-xai-state.json
            .arcade-qa-high-punch-f4-upload-state.json
            .arcade-qa-milei-canonical-upload-state.json
            .artifacts/arcade-motion-xai-canary/
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
