name: Import reviewed manual canonical set

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Enter rosalia-v2
        required: true
        default: rosalia-v2
        type: string
      descriptor_sha256:
        description: Exact SHA-256 of arcade/reviewed-manual-canonical/rosalia-v2.json
        required: true
        type: string
      qa_decision:
        description: Enter APPROVE_REVIEWED_MANUAL_CANONICAL_SET_V1
        required: true
        type: string
      confirmation:
        description: Enter IMPORT_REVIEWED_MANUAL_CANONICAL_SET_PRODUCTION_V1
        required: true
        type: string
      safety_confirmation:
        description: Enter SOURCES_ONLY_NO_PROVIDER_NO_GENERATION_NO_ACTIVATION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false

jobs:
  import-reviewed-manual-sources:
    name: Import six reviewed PNG sources only
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      REQUESTED_SLUG: ${{ inputs.slug }}
      REVIEWED_DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
      QA_DECISION: ${{ inputs.qa_decision }}
      IMPORT_CONFIRMATION: ${{ inputs.confirmation }}
      SAFETY_CONFIRMATION: ${{ inputs.safety_confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ASF_ARCADE_CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
      ASF_ARCADE_ADMIN_CLERK_USER_ID: ${{ secrets.ASF_ARCADE_ADMIN_CLERK_USER_ID }}
      ASF_WORKER_URL: ${{ vars.ASF_WORKER_URL }}
      ASF_WORKER_HEALTH_URL: ${{ vars.ASF_WORKER_HEALTH_URL }}
      CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate the exact reviewed source-only request
        shell: bash
        run: |
          [[ "$REQUESTED_SLUG" == "rosalia-v2" ]] || {
            printf '::error::This additive importer is sealed to rosalia-v2.\n'
            exit 1
          }
          [[ "$REVIEWED_DESCRIPTOR_SHA256" =~ ^[a-f0-9]{64}$ ]] || {
            printf '::error::descriptor_sha256 must be a lowercase SHA-256.\n'
            exit 1
          }
          [[ "$QA_DECISION" == "APPROVE_REVIEWED_MANUAL_CANONICAL_SET_V1" ]] || {
            printf '::error::The exact reviewed QA decision is required.\n'
            exit 1
          }
          [[ "$IMPORT_CONFIRMATION" == "IMPORT_REVIEWED_MANUAL_CANONICAL_SET_PRODUCTION_V1" ]] || {
            printf '::error::The exact manual source import confirmation is required.\n'
            exit 1
          }
          [[ "$SAFETY_CONFIRMATION" == "SOURCES_ONLY_NO_PROVIDER_NO_GENERATION_NO_ACTIVATION" ]] || {
            printf '::error::The exact no-provider/no-generation/no-activation confirmation is required.\n'
            exit 1
          }
          [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            printf '::error::Production R2 read credentials are unavailable.\n'
            exit 1
          }
          [[ -n "$ASF_ARCADE_CLERK_SECRET_KEY" && -n "$ASF_ARCADE_ADMIN_CLERK_USER_ID" ]] || {
            printf '::error::Production Arcade Clerk admin secrets are unavailable.\n'
            exit 1
          }
          [[ ${#CLERK_BACKEND_AUTH_BRIDGE_SECRET} -ge 32 ]] || {
            printf '::error::Production Clerk backend-auth bridge secret is unavailable.\n'
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            processor/package-lock.json

      - name: Install pinned dependencies
        run: |
          npm ci
          npm --prefix worker ci
          npm --prefix processor ci

      - name: Run the production gate with the exact media toolchain
        run: |
          docker build --file Dockerfile.processor --target video-sprite-test .
          VIDEO_SPRITE_PRODUCTION_TOOLCHAIN_VALIDATED=1 npm run check:production

      - name: Pin the live Worker to this reviewed commit
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const configured = process.env.ASF_WORKER_HEALTH_URL?.trim() ?? '';
          const workerBase = process.env.ASF_WORKER_URL?.trim() ?? '';
          if (workerBase !== 'https://api.insertplayer.ai') {
            throw new Error('Reviewed production operations require exact ASF_WORKER_URL=https://api.insertplayer.ai.');
          }
          const expectedTarget = `${workerBase}/health`;
          const target = configured || expectedTarget;
          const expectedSha = process.env.GITHUB_SHA?.trim() ?? '';
          if (
            !/^[a-f0-9]{40}$/.test(expectedSha)
            || new URL(target).toString() !== expectedTarget
          ) {
            throw new Error('Worker health URL and full reviewed commit SHA are required.');
          }
          const response = await fetch(target, {
            redirect: 'error',
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) throw new Error(`Worker health failed with HTTP ${response.status}.`);
          const health = await response.json();
          const expectedTag = new RegExp(`^prod-${expectedSha}-[1-9][0-9]*$`);
          if (
            health?.status !== 'ok' || health.environment !== 'production' ||
            health.storage?.d1 !== 'bound' || health.storage?.r2 !== 'bound' ||
            typeof health.workerVersion?.tag !== 'string' ||
            !expectedTag.test(health.workerVersion.tag)
          ) throw new Error(`Live Worker is not the healthy production deployment for ${expectedSha}.`);
          console.log(`Worker health pinned to ${health.workerVersion.tag}.`);
          NODE

      - name: Import only the six reviewed content-addressed PNGs
        shell: bash
        run: |
          descriptor="$GITHUB_WORKSPACE/arcade/reviewed-manual-canonical/rosalia-v2.json"
          output="$RUNNER_TEMP/reviewed-manual-canonical-import"
          downloads="$RUNNER_TEMP/reviewed-manual-canonical-r2"
          npm run arcade:import:reviewed-manual-canonical -- \
            --execute-production \
            --slug="$REQUESTED_SLUG" \
            --descriptor="$descriptor" \
            --descriptor-sha256="$REVIEWED_DESCRIPTOR_SHA256" \
            --output-dir="$output" \
            --r2-download-dir="$downloads" \
            --qa-decision="$QA_DECISION" \
            --confirm="$IMPORT_CONFIRMATION" \
            --confirm-safety="$SAFETY_CONFIRMATION" \
            --reviewed-by="$GITHUB_ACTOR"

      - name: Publish the reviewed-current-v1 handoff for Video
        uses: actions/upload-artifact@v6
        with:
          name: arcade-reviewed-canonical-manifest-rosalia-v2
          path: |
            ${{ runner.temp }}/reviewed-manual-canonical-import/reviewed-canonical-manifest.json
            ${{ runner.temp }}/reviewed-manual-canonical-import/reviewed-canonical-operator-manifest.json
            ${{ runner.temp }}/reviewed-manual-canonical-import/import-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the source-import checkpoint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: arcade-reviewed-manual-canonical-import-checkpoint-rosalia-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/reviewed-manual-canonical-import/import-state.json
          if-no-files-found: ignore
          retention-days: 30
