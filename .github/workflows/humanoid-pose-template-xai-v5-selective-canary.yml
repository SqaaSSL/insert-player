name: Generate encrypted humanoid V5 selective pose canary

run-name: humanoid-xai-selective-v5-${{ inputs.confirmation == 'GENERATE_HUMANOID_POSE_TEMPLATE_XAI_SELECTIVE_CANARY_V5' && 'canary' || 'invalid' }}

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter the exact V5 selective canary confirmation phrase
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: humanoid-neutral-medium-xai-selective-v5
  cancel-in-progress: false

jobs:
  generate:
    name: Five-frame pose-adherence canary only
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      PIXCLI_BASE_URL: https://pixcli.hilo.cx
      HUMANOID_WORK_DIR: .humanoid-template-v5-selective-work
      HUMANOID_ARTIFACT_NAME: humanoid-neutral-medium-xai-selective-v5-encrypted

    steps:
      - name: Validate single-use canary authorization
        id: authorize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
            printf '::error::Paid workflow reruns are forbidden; inspect the encrypted checkpoint instead.\n'
            exit 1
          }
          expected='GENERATE_HUMANOID_POSE_TEMPLATE_XAI_SELECTIVE_CANARY_V5'
          [[ "$REQUESTED_CONFIRMATION" == "$expected" ]] || {
            printf '::error::Exact V5 selective canary confirmation phrase required.\n'
            exit 1
          }
          title="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json displayTitle --jq '.displayTitle')"
          duplicate="$({
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/workflows/humanoid-pose-template-xai-v5-selective-canary.yml/runs?event=workflow_dispatch&per_page=100" \
              --jq '.workflow_runs[] | [.id, .display_title] | @tsv'
          } | awk -F '\t' -v current="$GITHUB_RUN_ID" -v title="$title" \
              '$1 + 0 < current + 0 && $2 == title { found=1 } END { print found + 0 }')"
          [[ "$duplicate" == '0' ]] || {
            printf '::error::This exact paid authorization was already consumed.\n'
            exit 1
          }
          printf 'GENERATOR_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"
          printf 'generator_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out the exact reviewed V5 generator commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.authorize.outputs.generator_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies and image tooling without provider secrets
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          command -v ffmpeg >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          }
          ffmpeg -version | head -n 1

      - name: Verify private keys exist after all third-party setup
        shell: bash
        env:
          PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
          HUMANOID_ARTIFACT_KEY: ${{ secrets.HUMANOID_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$PIXCLI_API_KEY" && -n "$HUMANOID_ARTIFACT_KEY" ]] || {
            printf '::error::Required production provider/encryption key is unavailable.\n'
            exit 1
          }

      - name: Prove V5 selection, transforms, prompt, budget, audit, and isolation
        run: npm run test:arcade:xai-humanoid-v5-selective

      - name: Decrypt the private canonical seeds only inside the canary runner
        shell: bash
        env:
          HUMANOID_ARTIFACT_KEY: ${{ secrets.HUMANOID_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          seed_dir=arcade/pose-master-seeds
          encrypted="$seed_dir/humanoid-neutral-medium-v1-seeds.tar.gz.ipenc"
          expected="$(cut -d ' ' -f 1 "$encrypted.sha256")"
          actual="$(sha256sum "$encrypted" | cut -d ' ' -f 1)"
          [[ "$actual" == "$expected" ]] || {
            printf '::error::Encrypted canonical seed SHA-256 mismatch.\n'
            exit 1
          }
          node scripts/encrypted-humanoid-bundle.mjs \
            --decrypt \
            --input="$encrypted" \
            --output=/tmp/humanoid-neutral-medium-v1-seeds.tar.gz
          tar -tzf /tmp/humanoid-neutral-medium-v1-seeds.tar.gz \
            | awk '$0 !~ /^arcade\/pose-master-seeds\/humanoid-neutral-medium-(canonical-v1|canonical-v1-normalized|identity-close-v1)\.png$/ { bad=1 } END { exit bad }'
          tar -xzf /tmp/humanoid-neutral-medium-v1-seeds.tar.gz

      - name: Freeze the five selective pose references and conflict-free identity crop
        run: >-
          npm run arcade:canary:xai-humanoid-v5-selective --
          --prepare
          --work-dir="$HUMANOID_WORK_DIR"

      - name: Execute exactly five paid edits with no retry or fallback
        env:
          PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
        run: >-
          npm run arcade:canary:xai-humanoid-v5-selective --
          --execute
          --mode=canary
          --confirm="$REQUESTED_CONFIRMATION"
          --generator-sha="$GENERATOR_SHA"
          --run-id="$GITHUB_RUN_ID"
          --work-dir="$HUMANOID_WORK_DIR"

      - name: Publish the non-activating human-review summary
        if: always()
        shell: bash
        run: |
          state="$HUMANOID_WORK_DIR/state.json"
          manifest="$HUMANOID_WORK_DIR/inputs/input-manifest.json"
          if [[ -f "$state" && -f "$manifest" ]]; then
            paid="$(jq -r '[.slots[] | .costMicrocredits // empty] | add // 0' "$state")"
            {
              printf '## Humanoid neutral medium — V5 selective pose canary\n\n'
              printf -- '- Status: `%s`\n' "$(jq -r '.status' "$state")"
              printf -- '- Completed selective poses: `%s / 5`\n' "$(jq -r '.completedPoseCount // 0' "$state")"
              printf -- '- Plan SHA-256: `%s`\n' "$(jq -r '.planSha256' "$state")"
              printf -- '- Paid total so far: `$%.2f`\n' "$(awk "BEGIN { print $paid / 1000000 }")"
              printf -- '- Imported or activated: `false`\n'
              printf -- '- Raw outputs and registration transforms require human review.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Encrypt the complete V5 checkpoint before it leaves the runner
        if: always()
        shell: bash
        env:
          HUMANOID_ARTIFACT_KEY: ${{ secrets.HUMANOID_ARTIFACT_KEY }}
        run: |
          set -euo pipefail
          [[ -d "$HUMANOID_WORK_DIR" && -f "$HUMANOID_WORK_DIR/state.json" ]] || exit 0
          mkdir -p .humanoid-v5-selective-encrypted-artifact
          tar -czf .humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz "$HUMANOID_WORK_DIR"
          node scripts/encrypted-humanoid-bundle.mjs \
            --encrypt \
            --input=.humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz \
            --output=.humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz.ipenc
          encrypted_sha="$(sha256sum .humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz.ipenc | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$encrypted_sha" 'humanoid-selective-v5-checkpoint.tar.gz.ipenc' \
            > .humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz.ipenc.sha256
          jq -n \
            --argjson schemaVersion 2 \
            --arg experimentId 'humanoid-neutral-medium-xai-selective-v5' \
            --arg runId "$GITHUB_RUN_ID" \
            --arg generatorCommitSha "$(jq -r '.generatorCommitSha' "$HUMANOID_WORK_DIR/state.json")" \
            --arg status "$(jq -r '.status' "$HUMANOID_WORK_DIR/state.json")" \
            --argjson completedPoseCount "$(jq -r '.completedPoseCount // 0' "$HUMANOID_WORK_DIR/state.json")" \
            --arg encryptedSha256 "$encrypted_sha" \
            '{schemaVersion: $schemaVersion, experimentId: $experimentId, runId: $runId, generatorCommitSha: $generatorCommitSha, status: $status, completedPoseCount: $completedPoseCount, encryptedSha256: $encryptedSha256}' \
            > .humanoid-v5-selective-encrypted-artifact/checkpoint-metadata.json

      - name: Preserve only ciphertext, checksum, and non-sensitive lineage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: humanoid-neutral-medium-xai-selective-v5-encrypted
          path: |
            .humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz.ipenc
            .humanoid-v5-selective-encrypted-artifact/humanoid-selective-v5-checkpoint.tar.gz.ipenc.sha256
            .humanoid-v5-selective-encrypted-artifact/checkpoint-metadata.json
          if-no-files-found: warn
          retention-days: 90
          include-hidden-files: true
