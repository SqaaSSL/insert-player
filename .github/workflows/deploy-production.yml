name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_durable_object_lifecycle:
        description: >-
          Ship Durable Object lifecycle changes (new/renamed/deleted classes).
          The resulting Worker version cannot be rolled back to the previous one.
        type: boolean
        default: false

permissions:
  contents: read
  vulnerability-alerts: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy production
    needs: validate
    concurrency:
      group: production-worker-mutations
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://insertplayer.ai
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_PUBLIC_APP_NAME: Insert Player
      VITE_PUBLIC_APP_SHORT_NAME: P1
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ vars.VITE_GOOGLE_MAPS_BROWSER_KEY }}
      VITE_GEMINI_IMAGE_MODEL_REPOSE: ${{ vars.VITE_GEMINI_IMAGE_MODEL_REPOSE }}
      VITE_GEMINI_IMAGE_MODEL_UPRIGHT: ${{ vars.VITE_GEMINI_IMAGE_MODEL_UPRIGHT }}
      VITE_GEMINI_IMAGE_MODEL_CROUCH: ${{ vars.VITE_GEMINI_IMAGE_MODEL_CROUCH }}
      VITE_BG_REMOVAL_PROVIDER: ${{ vars.VITE_BG_REMOVAL_PROVIDER }}
      VITE_INTRO_VIDEO_PROVIDER: ${{ vars.VITE_INTRO_VIDEO_PROVIDER }}
      CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
      CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      CLERK_AUTHORIZED_PARTIES: ${{ vars.CLERK_AUTHORIZED_PARTIES }}
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      STRIPE_PRICE_STARTER: ${{ vars.STRIPE_PRICE_STARTER }}
      STRIPE_PRICE_VERSUS: ${{ vars.STRIPE_PRICE_VERSUS }}
      STRIPE_PRICE_ARCADE: ${{ vars.STRIPE_PRICE_ARCADE }}
      ASF_FORBIDDEN_STRIPE_ACCOUNT_IDS: ${{ vars.ASF_FORBIDDEN_STRIPE_ACCOUNT_IDS }}
      TURNSTILE_HOSTNAMES: ${{ vars.TURNSTILE_HOSTNAMES }}
      ASF_PUBLIC_APP_NAME: Insert Player
      ASF_PUBLIC_APP_SHORT_NAME: P1
      ASF_SOCIAL_CARD_PATH: /assets/social-card-v12.jpg
      ASF_WORKER_URL: ${{ vars.ASF_WORKER_URL }}
      ASF_WORKER_HEALTH_URL: ${{ vars.ASF_WORKER_HEALTH_URL }}
      ASF_FRONTEND_URL: ${{ vars.ASF_FRONTEND_URL }}
      ASF_FRONTEND_ORIGIN: ${{ vars.ASF_FRONTEND_ORIGIN }}
      ASF_PAGES_PROJECT_NAME: ${{ vars.ASF_PAGES_PROJECT_NAME }}
      ASF_PAGES_BRANCH: main
      ASF_CLOUDFLARE_ZONE_ID: ${{ vars.ASF_CLOUDFLARE_ZONE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check queued release revision
        id: queued-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-queued-release.mjs --branch=main

      - name: Attest canonical production source
        if: steps.queued-release.outputs.current == 'true'
        run: |
          node scripts/production-deploy-guard.mjs
          printf 'ASF_CANONICAL_RELEASE_ATTESTED_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js
        if: steps.queued-release.outputs.current == 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            processor/package-lock.json

      - name: Install frontend dependencies
        if: steps.queued-release.outputs.current == 'true'
        run: npm ci --no-audit --no-fund

      - name: Install Worker dependencies
        if: steps.queued-release.outputs.current == 'true'
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Install processor dependencies
        if: steps.queued-release.outputs.current == 'true'
        run: npm --prefix processor ci --no-audit --no-fund

      - name: Materialize brand clearance
        if: steps.queued-release.outputs.current == 'true'
        env:
          ASF_BRAND_CLEARANCE_FILE: ${{ runner.temp }}/brand-clearance.json
          BRAND_CLEARANCE_JSON: ${{ secrets.BRAND_CLEARANCE_JSON }}
        run: |
          if [ -z "$BRAND_CLEARANCE_JSON" ]; then
            printf '%s\n' 'BRAND_CLEARANCE_JSON is required.' >&2
            exit 1
          fi
          install -m 600 /dev/null "$ASF_BRAND_CLEARANCE_FILE"
          printf '%s' "$BRAND_CLEARANCE_JSON" > "$ASF_BRAND_CLEARANCE_FILE"
          node -e 'JSON.parse(require("node:fs").readFileSync(process.env.ASF_BRAND_CLEARANCE_FILE, "utf8"))'
          printf '%s\n' "ASF_BRAND_CLEARANCE_FILE=$ASF_BRAND_CLEARANCE_FILE" >> "$GITHUB_ENV"

      - name: Validate and stage live configuration
        if: steps.queued-release.outputs.current == 'true'
        env:
          ASF_BRAND_CLEARANCE_FILE: ${{ runner.temp }}/brand-clearance.json
          METERKEY_API_KEY: ${{ secrets.METERKEY_API_KEY }}
          PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ANONYMIZATION_SECRET: ${{ secrets.ANONYMIZATION_SECRET }}
          GENERATION_JOB_SIGNING_SECRET: ${{ secrets.GENERATION_JOB_SIGNING_SECRET }}
          CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: node scripts/apply-live-config.mjs --require-complete --skip-production-check --skip-secrets

      - name: Preflight Meterkey credentials
        if: steps.queued-release.outputs.current == 'true'
        env:
          METERKEY_API_KEY: ${{ secrets.METERKEY_API_KEY }}
          METERKEY_BASE_URL: https://meter.hilo.cx
          ASF_METERKEY_EXPECTED_KEY_ID: ${{ vars.ASF_METERKEY_EXPECTED_KEY_ID }}
          ASF_METERKEY_EXPECTED_KEY_FINGERPRINT: ${{ vars.ASF_METERKEY_EXPECTED_KEY_FINGERPRINT }}
          ASF_METERKEY_EXPECTED_USER_ID: ${{ vars.ASF_METERKEY_EXPECTED_USER_ID }}
          ASF_METERKEY_EXPECTED_WALLET_ID: ${{ vars.ASF_METERKEY_EXPECTED_WALLET_ID }}
          ASF_METERKEY_MIN_AVAILABLE_UC: ${{ vars.ASF_METERKEY_MIN_AVAILABLE_UC }}
          ASF_METERKEY_EXPECTED_PER_REQUEST_CAP_UC: ${{ vars.ASF_METERKEY_EXPECTED_PER_REQUEST_CAP_UC }}
        run: npm run check:meterkey-auth

      - name: Capture stable Worker version
        if: steps.queued-release.outputs.current == 'true'
        id: stable-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ASF_BOOTSTRAP_STABLE_VERSION_ID: ${{ vars.ASF_BOOTSTRAP_STABLE_VERSION_ID }}
          ASF_BOOTSTRAP_STABLE_GIT_SHA: ${{ vars.ASF_BOOTSTRAP_STABLE_GIT_SHA }}
        run: node scripts/worker-version-rollout.mjs current

      - name: Guard rollback-safe full rollout scope
        if: steps.queued-release.outputs.current == 'true'
        env:
          ROLLOUT_BASE_SHA: ${{ steps.stable-worker.outputs.stable_git_sha }}
          ROLLOUT_HEAD_SHA: ${{ github.sha }}
          ASF_ALLOW_DURABLE_OBJECT_LIFECYCLE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_durable_object_lifecycle == true && '1' || '0' }}
        run: node scripts/worker-version-rollout.mjs guard-full

      - name: Dry-run exact Worker and Container bundle
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ASF_WORKER_VERSION_TAG: prod-${{ github.sha }}-${{ github.run_attempt }}
          METERKEY_API_KEY: ${{ secrets.METERKEY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          LUDO_API_KEY: ${{ secrets.LUDO_API_KEY }}
          PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ANONYMIZATION_SECRET: ${{ secrets.ANONYMIZATION_SECRET }}
          GENERATION_JOB_SIGNING_SECRET: ${{ secrets.GENERATION_JOB_SIGNING_SECRET }}
          CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: node scripts/apply-live-config.mjs --skip-production-check --dry-run-worker-deploy

      - name: Require an idle generation pipeline before migrations
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-generation-idle.mjs

      - name: Apply production D1 migrations
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --prefix worker run db:migrate

      - name: Reconfirm an idle generation pipeline before deploy
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-generation-idle.mjs

      - name: Deploy Worker and compatible Container
        if: steps.queued-release.outputs.current == 'true'
        id: deploy-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ASF_WORKER_VERSION_TAG: prod-${{ github.sha }}-${{ github.run_attempt }}
          METERKEY_API_KEY: ${{ secrets.METERKEY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          LUDO_API_KEY: ${{ secrets.LUDO_API_KEY }}
          PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ANONYMIZATION_SECRET: ${{ secrets.ANONYMIZATION_SECRET }}
          GENERATION_JOB_SIGNING_SECRET: ${{ secrets.GENERATION_JOB_SIGNING_SECRET }}
          CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: node scripts/apply-live-config.mjs --skip-production-check --deploy-worker

      - name: Capture deployed Worker version
        if: steps.queued-release.outputs.current == 'true'
        id: deployed-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ASF_BOOTSTRAP_STABLE_VERSION_ID: ${{ vars.ASF_BOOTSTRAP_STABLE_VERSION_ID }}
          ASF_BOOTSTRAP_STABLE_GIT_SHA: ${{ vars.ASF_BOOTSTRAP_STABLE_GIT_SHA }}
        run: node scripts/worker-version-rollout.mjs current

      - name: Smoke production Worker
        if: steps.queued-release.outputs.current == 'true'
        env:
          ASF_EXPECTED_WORKER_VERSION_ID: ${{ steps.deployed-worker.outputs.stable_version_id }}
          ASF_EXPECTED_WORKER_VERSION_TAG: prod-${{ github.sha }}-${{ github.run_attempt }}
        run: npm run smoke:live

      - name: Wait for the compatible image processor Container
        if: steps.queued-release.outputs.current == 'true'
        # Leave room for rollback even when individual health requests time out.
        timeout-minutes: 22
        env:
          ASF_WORKER_URL: ${{ vars.ASF_WORKER_URL }}
          CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}
        run: npm run check:image-processor-contract

      - name: Configure and verify production Clerk Crews
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          ASF_CONFIGURE_CLERK_CREWS_CONFIRMATION: ENABLE_PRODUCTION_CLERK_CREWS
        run: node scripts/configure-clerk-crews.mjs --apply --confirm-production

      - name: Build, deploy, and smoke Pages
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:frontend -- --skip-production-check

      - name: Verify live readiness
        if: steps.queued-release.outputs.current == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run check:live-readiness

      - name: Restore stable Worker after failed rollout
        if: failure() && steps.queued-release.outputs.current == 'true' && steps.deploy-worker.outcome != 'skipped'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          STABLE_WORKER_VERSION_ID: ${{ steps.stable-worker.outputs.stable_version_id }}
        run: node scripts/worker-version-rollout.mjs rollback

      - name: Publish deployment summary
        if: steps.queued-release.outputs.current == 'true'
        run: |
          printf '%s\n' '## Production deployment' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Frontend: https://insertplayer.ai' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- API: https://api.insertplayer.ai' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary launch files
        if: always()
        env:
          ASF_BRAND_CLEARANCE_FILE: ${{ runner.temp }}/brand-clearance.json
        run: rm -f "$ASF_BRAND_CLEARANCE_FILE"
