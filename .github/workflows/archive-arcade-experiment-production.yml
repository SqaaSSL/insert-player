name: Archive immutable Arcade experiment in production

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Sealed experiment to preserve in production R2 and D1
        required: true
        type: choice
        options:
          - arcade-side-xai-trump-pose-transfer-v2
          - arcade-side-xai-global-pose-transfer-v1
          - arcade-high-kick-xai-trump-impact-v1
      confirmation:
        description: Enter ARCHIVE_IMMUTABLE_ARCADE_EXPERIMENT_V1
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false

jobs:
  archive:
    name: Verify and archive sealed experiment
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      REQUESTED_EXPERIMENT: ${{ inputs.experiment }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate the non-generative archive request
        shell: bash
        run: |
          [[ "$REQUESTED_CONFIRMATION" == "ARCHIVE_IMMUTABLE_ARCADE_EXPERIMENT_V1" ]] || {
            printf '::error::The exact immutable archive confirmation phrase is required.\n'
            exit 1
          }
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || {
            printf '::error::CLOUDFLARE_API_TOKEN is unavailable in the production environment.\n'
            exit 1
          }
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || {
            printf '::error::CLOUDFLARE_ACCOUNT_ID is unavailable in the production environment.\n'
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install pinned Wrangler
        run: npm --prefix worker ci

      - name: Prove archive integrity and append-only migration
        run: npm run test:arcade:archive

      - name: Resolve sealed GitHub artifact
        id: source
        shell: bash
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const catalog = JSON.parse(readFileSync('arcade/experiment-archive-2026.json', 'utf8'));
          const entry = catalog.experiments.find((candidate) => candidate.experimentId === process.env.REQUESTED_EXPERIMENT);
          if (!entry) throw new Error(`Experiment is not sealed: ${process.env.REQUESTED_EXPERIMENT}`);
          console.log(`run_id=${entry.githubRunId}`);
          console.log(`artifact_name=${entry.githubArtifactName}`);
          NODE

      - name: Restore exact immutable experiment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ steps.source.outputs.run_id }}"
          --repo "${{ github.repository }}"
          --name "${{ steps.source.outputs.artifact_name }}"
          --dir .

      - name: Verify all local bytes without mutating production
        run: npm run arcade:archive-experiment -- --experiment="$REQUESTED_EXPERIMENT" --dry-run

      - name: Deploy isolated prefix-scoped R2 upload bridge
        shell: bash
        run: |
          set -euo pipefail
          archive_worker_name="insert-player-archive-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          archive_token="$(openssl rand -hex 32)"
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          printf '::add-mask::%s\n' "$archive_token"
          printf '{"ARCHIVE_UPLOAD_TOKEN":"%s"}\n' "$archive_token" > "$secrets_file"
          printf 'ARCADE_ARCHIVE_WORKER_NAME=%s\n' "$archive_worker_name" >> "$GITHUB_ENV"
          node worker/node_modules/wrangler/bin/wrangler.js deploy \
            --config scripts/wrangler.archive-uploader.jsonc \
            --name "$archive_worker_name" \
            --secrets-file "$secrets_file"
          subdomain_payload="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          workers_subdomain="$(jq -er '.result.subdomain' <<< "$subdomain_payload")"
          bridge_base_url="https://${archive_worker_name}.${workers_subdomain}.workers.dev"
          ready=false
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error "$bridge_base_url/health" > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || {
            printf '::error::The isolated R2 upload bridge did not become ready.\n'
            exit 1
          }
          printf 'ARCADE_ARCHIVE_UPLOAD_URL=%s/archive-object\n' "$bridge_base_url" >> "$GITHUB_ENV"
          printf 'ARCADE_ARCHIVE_UPLOAD_TOKEN=%s\n' "$archive_token" >> "$GITHUB_ENV"

      - name: Archive content-addressed bytes and immutable D1 index
        run: >-
          npm run arcade:archive-experiment --
          --experiment="$REQUESTED_EXPERIMENT"
          --execute
          --confirm=ARCHIVE_IMMUTABLE_ARCADE_EXPERIMENT_V1

      - name: Delete isolated R2 upload bridge
        if: always() && env.ARCADE_ARCHIVE_WORKER_NAME != ''
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$ARCADE_ARCHIVE_WORKER_NAME")"
          if jq -e '.success == true or any(.errors[]?; .code == 10007)' "$response_file" > /dev/null; then
            printf 'Isolated R2 upload bridge removed (HTTP %s).\n' "$http_status"
          else
            printf '::error::Could not remove the isolated R2 upload bridge (HTTP %s).\n' "$http_status"
            jq '{success, errors}' "$response_file"
            exit 1
          fi

      - name: Publish archive result
        if: success()
        shell: bash
        run: |
          {
            printf '## Immutable Arcade experiment archived\n\n'
            printf -- '- Experiment: `%s`\n' "$REQUESTED_EXPERIMENT"
            printf -- '- Source run: `%s`\n' "${{ steps.source.outputs.run_id }}"
            printf -- '- Storage: content-addressed production R2 objects plus append-only D1 index\n'
            printf -- '- Provider calls: `0`\n'
            printf -- '- Fighter activation: `none`\n'
          } >> "$GITHUB_STEP_SUMMARY"
