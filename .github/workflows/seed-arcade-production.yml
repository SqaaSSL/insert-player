name: Seed production Arcade fighter

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Fighter slug from arcade/roster-2026.json
        required: true
        default: donald-trump
        type: string
      operation:
        description: Keep activation separate until visual QA passes
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - dry-run
          - seed
          - resume
          - activate-draft
          - activate-reviewed
          - restart-draft
          - register-draft
          - prepare-canary
          - canary-side
          - probe-side
      confirmation:
        description: Enter GEMINI_ONLY_PRODUCTION, ACTIVATE_COMPLETE_ARCADE_DRAFT_PRODUCTION, or ACTIVATE_REVIEWED_ARCADE_FIGHTER_PRODUCTION
        required: false
        type: string
      reviewed_video_final_job_id:
        description: Required final victory job id for activate-reviewed; rejected for every other operation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-worker-mutations
  cancel-in-progress: false

jobs:
  seed:
    name: Champion draft or reviewed activation
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: production
    env:
      REQUESTED_SLUG: ${{ inputs.slug }}
      REQUESTED_OPERATION: ${{ inputs.operation }}
      REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
      REVIEWED_VIDEO_FINAL_JOB_ID: ${{ inputs.reviewed_video_final_job_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ASF_ARCADE_CLERK_SECRET_KEY: ${{ secrets.ASF_LAUNCH_SMOKE_CLERK_KEY }}
      ASF_ARCADE_ADMIN_CLERK_USER_ID: ${{ secrets.ASF_ARCADE_ADMIN_CLERK_USER_ID }}
      ASF_WORKER_URL: ${{ vars.ASF_WORKER_URL }}
      ASF_WORKER_HEALTH_URL: ${{ vars.ASF_WORKER_HEALTH_URL }}
      CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate guarded request
        shell: bash
        run: |
          [[ "$REQUESTED_SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || {
            printf '::error::Invalid Arcade fighter slug.\n'
            exit 1
          }
          if [[ "$REQUESTED_OPERATION" == "activate-draft" ]]; then
            [[ "$REQUESTED_CONFIRMATION" == "ACTIVATE_COMPLETE_ARCADE_DRAFT_PRODUCTION" ]] || {
              printf '::error::Complete draft activation requires its exact dedicated confirmation phrase.\n'
              exit 1
            }
          elif [[ "$REQUESTED_OPERATION" == "activate-reviewed" ]]; then
            [[ "$REQUESTED_CONFIRMATION" == "ACTIVATE_REVIEWED_ARCADE_FIGHTER_PRODUCTION" ]] || {
              printf '::error::Reviewed activation requires its exact dedicated confirmation phrase.\n'
              exit 1
            }
            [[ "$REVIEWED_VIDEO_FINAL_JOB_ID" =~ ^[a-f0-9]{32}$ ]] || {
              printf '::error::activate-reviewed requires the exact final victory Video job id.\n'
              exit 1
            }
          elif [[ "$REQUESTED_OPERATION" != "dry-run" && "$REQUESTED_OPERATION" != "preflight" ]]; then
            [[ "$REQUESTED_CONFIRMATION" == "GEMINI_ONLY_PRODUCTION" ]] || {
              printf '::error::Production mutations and billable generation require the exact confirmation phrase.\n'
              exit 1
            }
          fi
          if [[ "$REQUESTED_OPERATION" != "activate-reviewed" && -n "$REVIEWED_VIDEO_FINAL_JOB_ID" ]]; then
            printf '::error::reviewed_video_final_job_id is accepted only by activate-reviewed.\n'
            exit 1
          fi
          if [[ "$REQUESTED_OPERATION" != "dry-run" ]]; then
            [[ -n "$ASF_ARCADE_CLERK_SECRET_KEY" ]] || {
              printf '::error::ASF_LAUNCH_SMOKE_CLERK_KEY is unavailable in the production environment.\n'
              exit 1
            }
            [[ -n "$ASF_ARCADE_ADMIN_CLERK_USER_ID" ]] || {
              printf '::error::ASF_ARCADE_ADMIN_CLERK_USER_ID is unavailable in the production environment.\n'
              exit 1
            }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            processor/package-lock.json

      - name: Pin the live Worker to this reviewed commit before activation
        if: inputs.operation == 'activate-draft' || inputs.operation == 'activate-reviewed'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const configured = process.env.ASF_WORKER_HEALTH_URL?.trim() ?? '';
          const workerBase = process.env.ASF_WORKER_URL?.trim() ?? '';
          if (workerBase !== 'https://api.insertplayer.ai') {
            throw new Error(
              'Reviewed production operations require exact ASF_WORKER_URL=https://api.insertplayer.ai.',
            );
          }
          const expectedSha = process.env.GITHUB_SHA?.trim() ?? '';
          const expectedTarget = workerBase ? `${workerBase}/health` : '';
          const target = configured || expectedTarget;
          if (!target || !expectedTarget || !/^[a-f0-9]{40}$/.test(expectedSha)) {
            throw new Error('Worker health URL and full reviewed commit SHA are required.');
          }
          const url = new URL(target);
          if (url.protocol !== 'https:' || url.toString() !== new URL(expectedTarget).toString()) {
            throw new Error('Worker health pin must use ASF_WORKER_URL/health over HTTPS.');
          }
          const response = await fetch(url, {
            redirect: 'error',
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) throw new Error(`Worker health failed with HTTP ${response.status}.`);
          const health = await response.json();
          const expectedTag = new RegExp(`^prod-${expectedSha}-[1-9][0-9]*$`);
          if (
            health?.status !== 'ok' || health.environment !== 'production' ||
            health.storage?.d1 !== 'bound' || health.storage?.r2 !== 'bound' ||
            typeof health.workerVersion?.id !== 'string' || !health.workerVersion.id ||
            typeof health.workerVersion?.tag !== 'string' ||
            !expectedTag.test(health.workerVersion.tag)
          ) {
            throw new Error(`Live Worker is not the healthy production deployment for exact SHA ${expectedSha}.`);
          }
          console.log(`Worker health pinned to ${health.workerVersion.tag}.`);
          NODE

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Worker dependencies
        run: npm --prefix worker ci

      - name: Install processor dependencies
        run: npm --prefix processor ci

      - name: Prove the approved image-provider boundary
        if: inputs.operation != 'activate-draft' && inputs.operation != 'activate-reviewed'
        shell: bash
        run: |
          [[ -f processor/scripts/assert-approved-image-providers.mjs ]] || {
            printf '::error::The Gemini-only runtime guard is not present on this commit. Generation remains disabled.\n'
            exit 1
          }
          node processor/scripts/assert-approved-image-providers.mjs
          npm --prefix processor run build

      - name: Test video compiler with production FFmpeg toolchain
        run: docker build --file Dockerfile.processor --target video-sprite-test .

      - name: Run production gate
        env:
          VIDEO_SPRITE_PRODUCTION_TOOLCHAIN_VALIDATED: "1"
        run: npm run check:production

      - name: Restore and verify the private licensed source
        if: inputs.operation != 'preflight'
        run: npm run arcade:sources -- --target=production --slug="$REQUESTED_SLUG"

      - name: Run the selected Champion roster operation
        shell: bash
        run: |
          seed_args=(--target=production --slug="$REQUESTED_SLUG")
          case "$REQUESTED_OPERATION" in
            preflight)
              seed_args+=(--preflight-only)
              ;;
            dry-run)
              seed_args+=(--dry-run)
              ;;
            seed)
              seed_args+=(--confirm-production)
              ;;
            resume)
              seed_args+=(--resume --confirm-production)
              ;;
            activate-draft)
              seed_args+=(
                --activate-draft
                --confirm-production
                --confirm-activation="$REQUESTED_CONFIRMATION"
                --expected-deployed-sha="$GITHUB_SHA"
              )
              ;;
            activate-reviewed)
              seed_args+=(
                --activate-reviewed
                --confirm-production
                --confirm-activation="$REQUESTED_CONFIRMATION"
                --reviewed-video-final-job-id="$REVIEWED_VIDEO_FINAL_JOB_ID"
                --expected-deployed-sha="$GITHUB_SHA"
              )
              ;;
            restart-draft)
              seed_args+=(--restart-draft --confirm-production)
              ;;
            register-draft)
              seed_args+=(--register-draft --confirm-production)
              ;;
            prepare-canary)
              seed_args+=(--prepare-canary --confirm-production)
              ;;
            canary-side)
              seed_args+=(--canary-side --confirm-production)
              ;;
            probe-side)
              seed_args+=(--probe-side --confirm-production)
              ;;
            *)
              printf '::error::Unsupported Arcade seed operation.\n'
              exit 1
              ;;
          esac
          npm run arcade:seed -- "${seed_args[@]}"

      - name: Upload resumable seed checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: arcade-seed-${{ inputs.slug }}-${{ github.run_id }}
          path: .arcade-state.json
          if-no-files-found: ignore
          retention-days: 30
