name: Deploy development

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  vulnerability-alerts: read

concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Deploy sandbox
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: development
      url: https://insert-player-sandbox.pages.dev
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_PUBLIC_APP_NAME: Insert Player
      VITE_PUBLIC_APP_SHORT_NAME: P1
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ vars.VITE_GOOGLE_MAPS_BROWSER_KEY }}
      VITE_GEMINI_IMAGE_MODEL_REPOSE: ${{ vars.VITE_GEMINI_IMAGE_MODEL_REPOSE }}
      VITE_GEMINI_IMAGE_MODEL_UPRIGHT: ${{ vars.VITE_GEMINI_IMAGE_MODEL_UPRIGHT }}
      VITE_GEMINI_IMAGE_MODEL_CROUCH: ${{ vars.VITE_GEMINI_IMAGE_MODEL_CROUCH }}
      VITE_BG_REMOVAL_PROVIDER: ${{ vars.VITE_BG_REMOVAL_PROVIDER }}
      VITE_INTRO_VIDEO_PROVIDER: ${{ vars.VITE_INTRO_VIDEO_PROVIDER }}
      CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
      CLERK_AUTHORIZED_PARTIES: ${{ vars.CLERK_AUTHORIZED_PARTIES }}
      STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_ACCOUNT_ID }}
      STRIPE_PRICE_STARTER: ${{ vars.STRIPE_PRICE_STARTER }}
      STRIPE_PRICE_VERSUS: ${{ vars.STRIPE_PRICE_VERSUS }}
      STRIPE_PRICE_ARCADE: ${{ vars.STRIPE_PRICE_ARCADE }}
      ASF_FORBIDDEN_STRIPE_ACCOUNT_IDS: ${{ vars.ASF_FORBIDDEN_STRIPE_ACCOUNT_IDS }}
      ASF_STRIPE_WEBHOOK_URL: ${{ vars.ASF_STRIPE_WEBHOOK_URL }}
      ASF_SANDBOX_WORKER_URL: ${{ vars.ASF_SANDBOX_WORKER_URL }}
      ASF_SANDBOX_FRONTEND_URL: ${{ vars.ASF_SANDBOX_FRONTEND_URL }}
      ASF_SANDBOX_PAGES_PROJECT_NAME: ${{ vars.ASF_SANDBOX_PAGES_PROJECT_NAME }}
      ASF_SANDBOX_PAGES_BRANCH: develop

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Attest canonical development source
        run: |
          node scripts/development-deploy-guard.mjs
          printf 'ASF_CANONICAL_DEVELOPMENT_ATTESTED_SHA=%s\n' "$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            processor/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Worker dependencies
        run: npm --prefix worker ci --no-audit --no-fund

      - name: Install processor dependencies
        run: npm --prefix processor ci --no-audit --no-fund

      - name: Configure, migrate, deploy, and smoke Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          FREEPIK_API_KEY: ${{ secrets.FREEPIK_API_KEY }}
          LUDO_API_KEY: ${{ secrets.LUDO_API_KEY }}
          PIXCLI_API_KEY: ${{ secrets.PIXCLI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          ANONYMIZATION_SECRET: ${{ secrets.ANONYMIZATION_SECRET }}
          GENERATION_JOB_SIGNING_SECRET: ${{ secrets.GENERATION_JOB_SIGNING_SECRET }}
          CLERK_BACKEND_AUTH_BRIDGE_SECRET: ${{ secrets.CLERK_BACKEND_AUTH_BRIDGE_SECRET }}
          GOOGLE_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_SERVER_KEY }}
        run: npm run config:sandbox

      - name: Build, deploy, and smoke Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:frontend:sandbox

      - name: Publish deployment summary
        run: |
          printf '%s\n' '## Development deployment' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- Frontend: https://insert-player-sandbox.pages.dev' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' '- API: https://insert-player-api-sandbox.shellbot.workers.dev' >> "$GITHUB_STEP_SUMMARY"
